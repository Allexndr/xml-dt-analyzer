# Устанавливается как /etc/nginx/conf.d/default.conf (контекст http).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# If TLS terminates at a load balancer in front of nginx, keep its scheme for the backend
# (decides the Secure flag of cookies); otherwise use our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 55m;
    server_tokens off;

    # Заголовки безопасности (add_header не используется внутри location, чтобы они не терялись)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;  # keep the port: the relay compares Origin with Host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # overwrite: client-supplied values must not reach rate limits
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # WebSocket (/api/relay)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Хэшированные ассеты Vite
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
