[project]
name = "xmldt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Allexndr", email = "sanmemik2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "psycopg[binary]==3.2.3",
    "python-multipart==0.0.20",
    "pyyaml>=6.0.3",
    "uvicorn==0.34.0",
    "websockets==14.1",
]

[project.scripts]
xmldt = "xmldt:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
