    kind: code
    pitfalls: ["Значение «М» — товар из перечня маркируемых. Отсутствие признака ≠ нарушение: обязанность зависит от вида товара и даты."]
    review: pending

  - key: marking_details
    title: Сведения об идентификации маркированных товаров
    synonyms: [коды маркировки, маркировка, средства идентификации, КИЗ, честный знак, коды идентификации]
    graphs: ["31"]
    level: goods
    paths: [GDGoodsShipmentDetails/GDGoodsItemDetails/DTIdentificationMeansDetails]
    kind: group
    pitfalls:
      - "Код вида информации (InformationKindCode) различает контрольные (идентификационные) знаки (10) и средства идентификации — от него зависит формат и правила."
      - "Код хранится не одной строкой, а набором элементов данных (IdentificationMeansDataUnitDetails: AIId + значение). Для сравнения и поиска дублей код нужно собрать из элементов данных по порядку."
      - "Коды могут быть заданы ПЕРЕЧНЕМ (IdentificationMeansListDetails), ДИАПАЗОНОМ (IdentificationMeansRangeDetails: первый и последний) или АГРЕГИРОВАННЫМ ТАМОЖЕННЫМ ИДЕНТИФИКАТОРОМ (IdentificationMeansCustomsId). Число кодов в диапазоне и за агрегатом НЕ равно числу элементов XML."
      - "CIMQuantity — заявленное количество знаков/средств идентификации; сверять с подсчитанным."
      - "CIMMarkingCode = «ПВ» — маркировка после выпуска; тогда перечня кодов может не быть законно."
      - "Уровень маркировки (AggregationKindCode): код может относиться к упаковке, а не к единице товара."
    review: pending

