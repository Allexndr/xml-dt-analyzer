# Каталог понятий для R.055 v1.2.0 (декларация на товары и КДТ).
#
# Назначение: связать бизнес-понятия («отправитель», «графа 31», «коды маркировки»)
# с элементами XML конкретной версии схемы. ИИ выбирает понятие по ключу и не пишет XPath сам.
#
# Статус: ЧЕРНОВИК. Пути проверены автоматически по XSD (scripts/build_kb.py),
# а соответствие графам ДТ подготовлено разработчиком по Решению КТС № 257 и
# ДОЛЖНО быть подтверждено таможенным экспертом (поле review: pending).
#
# Поля:
#   key       — стабильный идентификатор понятия
#   title     — название для пользователя
#   synonyms  — формулировки пользователя (для роутера и поиска)
#   graphs    — графы ДТ (Решение КТС № 257), строки; "33.2" = подраздел
#   level     — declaration | shipment | goods
#   paths     — пути от корня GoodsDeclaration (без него), по локальным именам
#   kind      — subject | value | code | amount | measure | country | document | group | count
#   classifier — код классификатора (Решение КТС № 378) или иного справочника, если применим
#   pitfalls  — особенности, которые нельзя упустить при ответе
#   review    — pending | approved (кем и когда)

schema: {code: R.055, version: 1.2.0, namespace: "urn:EEC:R:055:GoodsDeclaration:v1.2.0"}

